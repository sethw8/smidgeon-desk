<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>New stories · Smidgeon Desk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Smidgeon Desk: Jennie <-> Seth. Content lives in data/desk.json; this page only renders it.
   Replies go to Seth's Google Sheet through reply.js. See README.md. */
:root {
  --bg: #F3F0FC; --surface: #FFFFFF; --ink: #1F3566; --soft: #55658F; --line: #DCD6F0;
  --accent: #E0408F; --done: #2E8F84; --chip: #EAE5FA;
  --teal: #2E8F84; --amber: #C98A1B; --coral: #E0604F;
  --display: "Fredoka", ui-rounded, system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #16244D; --surface: #22356A; --ink: #FFFFFF; --soft: #C5D2FC; --line: #34497F;
  --accent: #F06AAA; --done: #5CC9B9; --chip: #2C4278; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #16244D; --surface: #22356A; --ink: #FFFFFF; --soft: #C5D2FC; --line: #34497F;
  --accent: #F06AAA; --done: #5CC9B9; --chip: #2C4278; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 16px/1.55 var(--body); }
.wrap { max-width: 780px; margin: 0 auto; padding: 28px max(16px, env(safe-area-inset-right)) 72px max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 36px; }
h1, h2 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 7vw, 42px); }
h2 { font-size: 25px; }
h3 { margin: 6px 0 0; font: 700 13px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
.lede { color: var(--soft); margin: 6px 0 0; max-width: 62ch; }
.summary, .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.pill { font: 700 14px var(--body); padding: 6px 12px; border-radius: 999px; background: var(--chip); }
.pill b { color: var(--accent); }
.tabs button { font: 700 14px var(--body); padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line);
  background: transparent; color: var(--ink); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
section { display: flex; flex-direction: column; gap: 12px; }
.group { display: flex; flex-direction: column; gap: 10px; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px;
  display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.task.done { opacity: .6; }
.task.done .title { text-decoration: line-through; text-decoration-color: var(--done); }
.meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--soft); }
.kind { font: 700 11.5px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.who { font: 700 11.5px var(--body); padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--ink); }
.title { font: 700 17px var(--body); overflow-wrap: anywhere; }
.detail { color: var(--soft); font-size: 15px; overflow-wrap: anywhere; }
a { color: var(--accent); font-weight: 800; }
details.reply summary { cursor: pointer; font: 700 14px var(--body); color: var(--ink); list-style: none; padding: 4px 0; }
details.reply summary::-webkit-details-marker { display: none; }
details.reply summary::before { content: "+ "; color: var(--accent); }
details.reply[open] summary::before { content: "– "; }
.reply form { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
textarea { width: 100%; min-height: 70px; resize: vertical; font: 500 15px var(--body); color: var(--ink);
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px 10px; }
label.chk { display: flex; gap: 8px; align-items: center; font-size: 15px; }
label.chk input { width: 20px; height: 20px; accent-color: var(--done); }
.btn { font: 700 15px var(--body); color: var(--bg); background: var(--ink); border: 0; border-radius: 999px;
  padding: 10px 18px; cursor: pointer; align-self: flex-start; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.saved { font-size: 13px; color: var(--done); min-height: 1em; }
button:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; }
.reviewed { margin-top: 10px; font-weight: 600; }
.status { white-space: pre-wrap; font-size: 15.5px; overflow-wrap: anywhere; }
.links { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
.owners { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 620px) { .owners { grid-template-columns: 1fr 1fr; } }
.owners p { margin: 4px 0 0; color: var(--soft); font-size: 15px; }
.log { display: flex; flex-direction: column; gap: 8px; }
.log div { background: var(--surface); border-radius: 14px; padding: 10px 14px; border: 1px solid var(--line); overflow-wrap: anywhere; }
.log small { display: block; font-size: 13px; color: var(--soft); }
.empty { color: var(--soft); }
.toggle { font: 700 14px var(--body); color: var(--soft); background: none; border: 0; cursor: pointer; padding: 4px 0; align-self: flex-start; }
.steam { display: inline-flex; gap: 6px; margin-top: 10px; }
.steam span { width: 14px; height: 14px; border-radius: 50%; }
footer { color: var(--soft); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>
.back { font: 700 15px var(--body); }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.story h2 { font-size: 23px; }
.feel { font: 700 12px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.beats { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; }
.beats li { padding-left: 2px; }
.beats li.branch { color: var(--soft); }
.beats li.branch::marker { color: var(--soft); }
.tag { font: 700 11px var(--body); background: var(--chip); border-radius: 999px; padding: 1px 8px; margin-left: 6px; color: var(--soft); white-space: nowrap; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.choice { font: 600 14px var(--body); border: 1.5px solid var(--line); border-radius: 12px; padding: 5px 10px; }
.choice small { color: var(--soft); font-weight: 500; }
details.more summary { cursor: pointer; font: 700 14px var(--body); list-style: none; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::before { content: "+ "; color: var(--accent); }
details.more[open] summary::before { content: "– "; }
details.more p, details.more ul { margin: 6px 0 0; color: var(--soft); font-size: 15px; }
details.more ul { padding-left: 20px; }
</style>
<script src="reply.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./">← Back to the Desk</a>
    <h1 style="margin-top:10px">New stories to review</h1>
    <p class="lede" id="intro">Loading…</p>
    <div class="tabs" id="tabs" role="group" aria-label="Show stories for"></div>
  </header>
  <section id="list" aria-label="Stories"><p class="empty">Loading…</p></section>
  <footer id="foot"></footer>
</div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const who = new URLSearchParams(location.search).get("who") === "Seth" ? "Seth" : "Jennie";
let data = null, feeling = "all";

function render() {
  const feelings = [...new Set(data.stories.map(s => s.feeling))];
  document.getElementById("tabs").innerHTML = ["all", ...feelings].map(f =>
    `<button type="button" data-f="${f}" aria-pressed="${f === feeling}">${f === "all" ? "All " + data.stories.length : f[0].toUpperCase() + f.slice(1)}</button>`).join("");
  const list = document.getElementById("list");
  list.innerHTML = "";
  data.stories.filter(s => feeling === "all" || s.feeling === feeling).forEach(s => list.append(card(s)));
}

function card(s) {
  const el = document.createElement("article");
  el.className = "story";
  // The path everyone hears, with the less helpful choice's detour shown as a branch.
  const helpful = new Set(); let id = s.beats[0].id;
  const byId = Object.fromEntries(s.beats.map(b => [b.id, b]));
  while (id && byId[id] && !helpful.has(id)) { helpful.add(id); const b = byId[id]; id = b.choices ? b.choices[b.choices.length - 1].goes : b.next; }
  const label = Object.fromEntries(s.beats.flatMap(b => (b.choices || []).map(c => [c.goes, c])));
  el.innerHTML = `<div class="feel">${esc(s.feeling)} · ${esc(s.size)}</div>
    <h2></h2><div class="detail lesson"></div>
    <ol class="beats">${s.beats.map(b => `<li class="${helpful.has(b.id) ? "" : "branch"}">
      ${!helpful.has(b.id) && label[b.id] ? `<span class="tag">if they pick “${esc(label[b.id].label)}”</span><br>` : ""}${esc(b.text)}
      ${b.choices ? `<div class="choices">${b.choices.map(c => `<span class="choice">${esc(c.emoji)} ${esc(c.label)}</span>`).join("")}</div>` : ""}</li>`).join("")}</ol>
    <details class="more"><summary>For the grown-up</summary>
      <p><b>${esc(s.grownUp.question)}</b></p><p>${esc(s.grownUp.insight)}</p><p><b>Try:</b> ${esc(s.grownUp.getLow)}</p>
      <ul>${s.grownUp.thenSay.map(t => `<li>${esc(t)}</li>`).join("")}</ul></details>
    <details class="more"><summary>Retold for the child</summary><ul>${s.forChild.map(t => `<li>${esc(t)}</li>`).join("")}</ul></details>
    ${s.review ? `<div class="detail reviewed">${s.review.approved ? "✅ Approved" : "💬 Replied"} by ${esc(s.review.by)}, ${esc(s.review.date)}${s.review.note ? ": <span class=\"rnote\"></span>" : ""}</div>` : ""}
    <details class="reply"><summary>Reply on this story</summary>
      <form><label class="chk"><input type="checkbox" name="done"> Approved as is</label>
      <textarea name="note" placeholder="What to change, or a note…" aria-label="Your reply"></textarea>
      <button class="btn" type="submit">Send</button><span class="saved" role="status"></span></form></details>`;
  el.querySelector("h2").textContent = s.title;
  el.querySelector(".lesson").textContent = s.lesson;
  if (s.review && s.review.note) el.querySelector(".rnote").textContent = s.review.note;
  const f = el.querySelector("form");
  f.addEventListener("submit", e => send(e, s, f));
  return el;
}

async function send(e, s, f) {
  e.preventDefault();
  const out = f.querySelector(".saved");
  const note = f.note.value.trim(), done = f.done.checked;
  if (!note && !done) { out.textContent = "Add a note or tick approved first."; return; }
  out.textContent = "Sending…";
  try {
    await sendDeskReply({ task: "story:" + s.id, title: "Story: " + s.title,
    from: who, done: done ? "yes" : "no", note });
    out.textContent = "Sent. Thank you!"; f.reset();
  } catch (err) { out.textContent = "Couldn't send from here. Tell your Claude instead."; }
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; feeling = b.dataset.f; render();
});
fetch("data/stories.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  data = d;
  document.getElementById("intro").textContent = d.intro;
  document.getElementById("foot").textContent = `Last updated ${d.updated} by ${d.updatedBy}.`;
  render();
}).catch(() => { document.getElementById("list").innerHTML = '<p class="empty">Couldn\'t load the stories.</p>'; });
</script>
</body>
</html>
